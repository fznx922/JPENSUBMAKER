[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jpensubmaker"
dynamic = ["version"]
description = "Japanese → English subtitles from video files, links and live system audio — local ASR + LLM, with a GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "faster-whisper>=1.1.1",
  "numpy>=1.24",
  "requests>=2.31",
  "yt-dlp>=2025.1.1",
  "soundcard>=0.4.3",
  "imageio-ffmpeg>=0.5",
  "nvidia-cublas-cu12; sys_platform != 'darwin'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

[project.optional-dependencies]
qwen = ["qwen-asr==0.0.6"]
dev = ["pytest>=8"]

[project.scripts]
jpensubmaker = "jpensubmaker.cli:main"

[project.gui-scripts]
jpensubmaker-gui = "jpensubmaker.gui.app:run"

[tool.setuptools]
packages = ["jpensubmaker", "jpensubmaker.gui"]

[tool.setuptools.dynamic]
version = { attr = "jpensubmaker.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
